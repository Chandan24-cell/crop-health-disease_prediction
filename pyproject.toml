[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-health-api"
version = "1.0.0"
description = "REST API for crop leaf disease assessment"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27", "pydantic>=2.6,<3",
  "pydantic-settings>=2.2", "python-multipart>=0.0.9", "slowapi>=0.1.9",
  "tensorflow>=2.15,<2.16", "opencv-python-headless>=4.9", "numpy>=1.26,<2", "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-Pillow"]
ml-pipeline = ["scikit-learn>=1.3", "scipy>=1.11", "matplotlib>=3.8", "seaborn>=0.13"]
export = ["tf2onnx>=1.16", "onnxruntime>=1.17"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--cov=backend.app.services.quality --cov=backend.app.services.severity --cov=backend.app.services.advice --cov=backend.app.services.report --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["arg-type", "type-arg", "no-any-return", "no-untyped-def"]
plugins = ["pydantic.mypy"]
