version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fieldnote-api:latest
    container_name: fieldnote-api
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - fieldnote-net

  nginx:
    image: nginx:alpine
    container_name: fieldnote-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fieldnote-net

networks:
  fieldnote-net:
    driver: bridge
