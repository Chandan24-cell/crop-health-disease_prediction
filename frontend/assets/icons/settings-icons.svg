<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="360" height="150" role="img" aria-label="Appearance, Preferences and Privacy icons" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ic { fill: none; stroke: #4F46E5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: #4F46E5; stroke: none; }
    .lbl { font: 600 14px system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
  </style>

  <!-- Appearance: half-filled circle with rays -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#EEF2FF"/>
    <circle class="ic" cx="40" cy="40" r="14"/>
    <path class="fill" d="M40 26a14 14 0 0 1 0 28z"/>
    <path class="ic" d="M40 12v6M40 62v6M12 40h6M62 40h6M20.2 20.2l4.2 4.2M55.6 55.6l4.2 4.2M59.8 20.2l-4.2 4.2M24.4 55.6l-4.2 4.2"/>
  </g>
  <text class="lbl" x="60" y="124">Appearance</text>

  <!-- Preferences: sliders -->
  <g transform="translate(140,20)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#EEF2FF"/>
    <path class="ic" d="M20 25h40M20 40h40M20 55h40"/>
    <circle cx="32" cy="25" r="6" fill="#fff" stroke="#4F46E5" stroke-width="3"/>
    <circle cx="50" cy="40" r="6" fill="#fff" stroke="#4F46E5" stroke-width="3"/>
    <circle cx="28" cy="55" r="6" fill="#fff" stroke="#4F46E5" stroke-width="3"/>
  </g>
  <text class="lbl" x="180" y="124">Preferences</text>

  <!-- Privacy: shield with lock -->
  <g transform="translate(260,20)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#EEF2FF"/>
    <path class="ic" d="M40 14l20 7v17c0 13-8.5 22-20 28-11.5-6-20-15-20-28V21z"/>
    <rect class="fill" x="32" y="38" width="16" height="12" rx="3"/>
    <path class="ic" d="M35 38v-4a5 5 0 0 1 10 0v4"/>
  </g>
  <text class="lbl" x="300" y="124">Privacy</text>
</svg>
